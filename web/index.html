<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Church Tree web app.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Church Tree">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Church Tree</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Install-to-home-screen glue.

    A browser fires `beforeinstallprompt` once, early — usually before
    Flutter has finished booting — and it only lets you show the install
    prompt from the event object it handed you. So the page catches that
    event here, keeps it, and exposes three small functions for the app to
    call. Without this the app could describe installing but never offer it.
  -->
  <script>
    (function () {
      var deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', function (event) {
        // Keeps the browser's own mini-infobar from appearing, so the offer
        // is made once, by the app, where it can be explained.
        event.preventDefault();
        deferredPrompt = event;
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
      });

      // Exposed as plain top-level functions rather than as one object:
      // the Dart side binds to them by name, and a method on an object
      // needs more interop machinery than this is worth.
      window.churchTreeInstallAvailable = function () {
        return deferredPrompt !== null;
      };

      window.churchTreeInstalled = function () {
        try {
          return window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: window-controls-overlay)').matches ||
            window.navigator.standalone === true;
        } catch (e) {
          return false;
        }
      };

      window.churchTreeUserAgent = function () {
        try {
          return window.navigator.userAgent || '';
        } catch (e) {
          return '';
        }
      };

      // Resolves to 'accepted', 'dismissed' or 'unavailable'. The browser
      // spends the event on a single use, so it is cleared either way.
      window.churchTreeInstallPrompt = function () {
        if (deferredPrompt === null) {
          return Promise.resolve('unavailable');
        }
        var event = deferredPrompt;
        deferredPrompt = null;
        try {
          event.prompt();
          return event.userChoice.then(function (choice) {
            return choice && choice.outcome ? choice.outcome : 'dismissed';
          });
        } catch (e) {
          return Promise.resolve('unavailable');
        }
      };
    })();
  </script>

</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
