# Equipment and Studio are admin-only drawer items (config.equipmentEnabled
# + adminOnly: true, and the studio screen similarly) — this QA account is
# a plain approved member, not a config-listed admin, so both are correctly
# absent from the drawer. Confirmed via screenshot: the drawer for this
# account shows exactly Church Groups, Prayer Request, Members, Favorites,
# Holy Bible, About, Settings. Re-run as an admin account to cover those
# two screens.

- tapOn: "Open navigation menu"
- waitForAnimationToEnd
- tapOn: "Settings"
