# Cheap continuation of full_qa_pass.yaml — assumes the app is ALREADY
# running, logged in as maestro.qa.runner@example.com, and inside tnbm
# (The New Beginning Ministries). No clearState, no onboarding, no login —
# just resumes and covers the remaining tabs/drawer/settings surface.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community"
    timeout: 90000

- tapOn: "Home"
- waitForAnimationToEnd
- takeScreenshot: qc_01_home

