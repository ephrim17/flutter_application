appId: com.example.flutter_application
---
# Read-only navigation smoke test: visits every main tab and drawer item and
# screenshots each. No data is created, edited or deleted.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Feeds"
    timeout: 15000

- tapOn: "Home"
- waitForAnimationToEnd
- takeScreenshot: nav_home

- tapOn: "For You"
